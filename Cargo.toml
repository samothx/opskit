[package]
name = "opskit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared plumbing for the host ops tools (logscan, vulnwatch, sitewatch): severity, mail, ntfy, LLM client, state files, secrets."
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
